<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云境大宅生活需求问卷</title>
  <meta http-equiv="refresh" content="0; url=index%20(1).html" />
  <style>
    :root {
      --bg: #f3f0ee;
      --card: #ffffff;
      --ink: #2d2a33;
      --muted: #7d7985;
      --gold: #b89662;
      --line: #e8e2db;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f7f4f1 0%, #efeae6 100%);
      color: var(--ink);
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: min(480px, 100%);
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 18px 42px rgba(43, 32, 18, 0.08);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(184,150,98,0.8);
      color: var(--gold);
      font-size: 20px;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
      font-family: Georgia, "Times New Roman", serif;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.2;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      text-decoration: none;
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 15px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    a:hover { transform: translateY(-1px); }
    a:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">YJ</div>
    <h1>云境大宅</h1>
    <p>页面正在跳转到问卷页面…</p>
    <a href="index%20(1).html">点击进入问卷</a>
  </div>
  <script>
    window.location.replace('index%20(1).html');
  </script>
</body>
</html>
